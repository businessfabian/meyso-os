# ============================================================
# ACHTUNG: Dieser Workflow braucht GEMINI_API_KEY in
# GitHub Secrets. Settings > Secrets and variables > Actions.
# Ohne den Key wird der Workflow failen.
# Dave muss den Secret einmalig einrichten.
# ============================================================

name: News Scout

on:
  schedule:
    # 08:00 UTC = 09:00 Berlin (winter/CET), montags
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  news-scout:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout meyso-os
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build prompt and call Gemini API
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LOOP_NAME: news-scout
        run: |
          export RUN_DATE=$(date +%Y-%m-%d)

          python3 - << 'PYEOF'
          import os

          run_date = os.environ['RUN_DATE']
          template_path = 'docs/autonomous-workflows/loop-02-news-scout.md'

          with open(template_path, 'r', encoding='utf-8') as f:
              prompt = f.read().replace('{date}', run_date)

          with open('/tmp/news-scout-prompt.txt', 'w', encoding='utf-8') as f:
              f.write(prompt)

          print('Prompt file written from', template_path)
          PYEOF

          PROMPT_FILE=/tmp/news-scout-prompt.txt \
          OUTPUT_FILE="docs/autonomous-workflows/briefings/${RUN_DATE}-news.md" \
          WORKFLOW_ID=news-scout \
          node scripts/run-loop.js

      - name: Commit briefing
        run: |
          RUN_DATE=$(date +%Y-%m-%d)
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add "docs/autonomous-workflows/briefings/${RUN_DATE}-news.md" \
                  docs/autonomous-workflows/workflows.json
          git diff --cached --quiet || git commit -m "chore: auto-generated briefing ${RUN_DATE} from news-scout"
          git push

      - name: Push Notification
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            curl -s \
              -H "Title: ${{ github.workflow }} erledigt" \
              -H "Priority: low" \
              -H "Tags: white_check_mark" \
              -H "Click: https://meyso.de/admin/workflows" \
              -d "${{ github.workflow }} vom $(date +%d.%m.%Y) ist durch." \
              https://ntfy.sh/meyso-dave || true
          else
            curl -s \
              -H "Title: ${{ github.workflow }} FEHLGESCHLAGEN" \
              -H "Priority: high" \
              -H "Tags: warning" \
              -H "Click: https://github.com/businessfabian/meyso-os/actions" \
              -d "${{ github.workflow }} vom $(date +%d.%m.%Y) ist fehlgeschlagen." \
              https://ntfy.sh/meyso-dave || true
          fi
