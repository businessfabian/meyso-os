# ============================================================
# ACHTUNG: Dieser Workflow braucht GEMINI_API_KEY in
# GitHub Secrets. Settings > Secrets and variables > Actions.
# Ohne den Key wird der Workflow failen.
# Dave muss den Secret einmalig einrichten.
# ============================================================

name: News Scout

on:
  schedule:
    # 08:00 UTC = 09:00 Berlin (winter/CET), montags
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  news-scout:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout meyso-os
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build prompt and call Gemini API
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LOOP_NAME: news-scout
        run: |
          export RUN_DATE=$(date +%Y-%m-%d)

          python3 - << 'PYEOF'
          import os

          run_date = os.environ['RUN_DATE']

          prompt = f"""Du bist ein KI-Assistent der Dave (Fabian) einen woechentlichen Tech-News Scout erstellt.

          Datum heute: {run_date}

          Dave arbeitet mit folgendem Stack: Next.js, React, TypeScript, Tailwind CSS, Vercel, Sanity CMS, Supabase, Redis (Upstash), Resend, Claude Code (Anthropic), Gemini API.

          Suche aktiv mit Google Search nach den neuesten Informationen zu den unten genannten Themen.
          Verwende echte, aktuelle Quellen und verlinke konkrete Changelogs, Release Notes oder Blogposts.
          Nutze KEIN Trainingswissen fuer Versionsnummern oder Release-Daten, sondern suche diese live nach.

          # News Scout {run_date}

          ## Next.js
          Suche nach den neuesten Releases, Breaking Changes und neuen Features der letzten 4 Wochen.
          Verlinke den offiziellen Changelog oder Release Notes.

          ## Vercel
          Suche nach den neuesten Platform-Updates und neuen Features der letzten 4 Wochen.
          Verlinke offizielle Ankuendigungen oder den Changelog.

          ## Anthropic / Claude Code
          Suche nach den neuesten Updates zu Claude API, Claude Code CLI und neuen Modellen.
          Verlinke offizielle Blogposts oder Release Notes.

          ## Supabase
          Suche nach den neuesten Features, Breaking Changes und Auth-Updates der letzten 4 Wochen.
          Verlinke den offiziellen Changelog oder Release Notes.

          ## Sanity CMS
          Suche nach relevanten Updates (falls nichts gefunden: "Nichts Relevantes gefunden").

          ## Action Items diese Woche
          Konkrete To-Dos fuer Dave basierend auf den gefundenen Updates (nur wenn wirklich relevant, sonst Abschnitt weglassen).

          ---

          Regeln:
          - Jede genannte Version oder jedes Feature MUSS mit einer echten URL belegt sein
          - Keine em-dashes (U+2014), stattdessen Komma oder Zeilenumbruch
          - Wenn keine aktuellen Neuigkeiten gefunden: "Nichts Relevantes gefunden" schreiben
          - Antworte NUR mit dem Markdown-Dokument
          """

          with open('/tmp/news-scout-prompt.txt', 'w', encoding='utf-8') as f:
              f.write(prompt)

          print('Prompt file written.')
          PYEOF

          PROMPT_FILE=/tmp/news-scout-prompt.txt \
          OUTPUT_FILE="docs/autonomous-workflows/briefings/${RUN_DATE}-news.md" \
          WORKFLOW_ID=news-scout \
          node scripts/run-loop.js

      - name: Commit briefing
        run: |
          RUN_DATE=$(date +%Y-%m-%d)
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add "docs/autonomous-workflows/briefings/${RUN_DATE}-news.md" \
                  docs/autonomous-workflows/workflows.json
          git diff --cached --quiet || git commit -m "chore: auto-generated briefing ${RUN_DATE} from news-scout"
          git push
